# Include at http scope. Certificate paths are deployment-specific.
limit_req_zone $binary_remote_addr zone=c2d_requests:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=c2d_connections:1m;
log_format c2d '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
server {
    listen 443 ssl;
    server_name c2d.liu.zj.cn;
    ssl_certificate /www/sites/c2d.liu.zj.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/c2d.liu.zj.cn/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    client_body_timeout 30s;
    limit_req zone=c2d_requests burst=20 nodelay;
    limit_req_status 429;
    limit_conn c2d_connections 20;
    limit_conn_status 429;
    access_log /var/log/nginx/capture2doc-access.log c2d;
    location /internal/ { return 404; }
    location /docs { return 404; }
    location /redoc { return 404; }
    location ~ "^/v1/documents/[a-f0-9]{32}/events$" {
        proxy_pass http://100.64.250.1:11209;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_next_upstream off;
        add_header X-Accel-Buffering no always;
    }
    location / {
        proxy_pass http://100.64.250.1:11209;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
