[project]
name = "capture2doc"
version = "0.1.0"
description = "Local inference server for Capture2Doc"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["lxml>=6.1.3,<7"]

[project.scripts]
capture2doc = "capture2doc.service.cli:main"

[project.optional-dependencies]
service = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sse-starlette>=3,<4", "pillow>=12.3.0", "httpx>=0.28,<1"]
cuda = [
    "modelscope>=1.39.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "openai>=3.7.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "pillow>=12.3.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "transformers>=5.16.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "vllm==0.28.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capture2doc"]
